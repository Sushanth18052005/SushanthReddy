<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Sushanth Reddy — AI/ML and Software Engineer">
  <defs>
    <radialGradient id="glow" cx="72%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#ff4a1f" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#ff4a1f" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff4a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- monogram -->
  <rect x="80" y="72" width="60" height="60" fill="none" stroke="#5d5a55" stroke-width="1.5"/>
  <text x="110" y="110" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" letter-spacing="2" fill="#c4bfb5" text-anchor="middle">PSR</text>
  <text x="160" y="109" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" letter-spacing="4" fill="#8c8880">SUSHANTH REDDY</text>

  <!-- eyebrow -->
  <rect x="80" y="290" width="52" height="2" fill="#ff4a1f"/>
  <text x="148" y="298" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" letter-spacing="3" fill="#8c8880">AI/ML ENGINEERING · FULL-STACK SOFTWARE</text>

  <!-- name -->
  <text x="76" y="420" font-family="Georgia, 'Iowan Old Style', ui-serif, serif" font-size="150" font-weight="500" letter-spacing="-4" fill="#f1ede5">Sushanth Reddy<tspan fill="#ff4a1f">.</tspan></text>

  <!-- role -->
  <text x="80" y="490" font-family="Georgia, ui-serif, serif" font-size="40" fill="#c4bfb5">AI/ML &amp; Software Engineer</text>

  <!-- footer strip -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#f1ede5" stroke-opacity="0.09" stroke-width="1"/>
  <text x="80" y="580" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" letter-spacing="1" fill="#8c8880">Co-inventor · Indian Patent 202541059395 A</text>
  <text x="1120" y="580" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" letter-spacing="1" fill="#5fe3c4" text-anchor="end">sushanth-reddy.vercel.app</text>
</svg>
